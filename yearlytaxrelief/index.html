<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Royval App Icon Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">
  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-xl w-full text-center">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Royval iPhone Icon Generator</h1>
    <p class="text-sm text-slate-500 mb-6">Click any icon below to download its 180x180 <code>apple-touch-icon.png</code> file.</p>
    
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <!-- Yearly Tax Relief -->
      <div class="flex flex-col items-center">
        <canvas id="tax-canvas" width="180" height="180" class="w-28 h-28 rounded-2xl shadow-md mb-3"></canvas>
        <p class="font-semibold text-sm text-slate-700 mb-2">Yearly Tax Relief</p>
        <button onclick="downloadIcon('tax-canvas')" class="text-xs bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-blue-800">
          Download PNG
        </button>
      </div>

      <!-- SK Planner -->
      <div class="flex flex-col items-center">
        <canvas id="sk-canvas" width="180" height="180" class="w-28 h-28 rounded-2xl shadow-md mb-3"></canvas>
        <p class="font-semibold text-sm text-slate-700 mb-2">SK Planner</p>
        <button onclick="downloadIcon('sk-canvas')" class="text-xs bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">
          Download PNG
        </button>
      </div>

      <!-- Badminton Social -->
      <div class="flex flex-col items-center">
        <canvas id="badminton-canvas" width="180" height="180" class="w-28 h-28 rounded-2xl shadow-md mb-3"></canvas>
        <p class="font-semibold text-sm text-slate-700 mb-2">Badminton Social</p>
        <button onclick="downloadIcon('badminton-canvas')" class="text-xs bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
          Download PNG
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. Yearly Tax Relief Icon (Blue + Invoice/Dollar)
    const taxCtx = document.getElementById('tax-canvas').getContext('2d');
    taxCtx.fillStyle = '#dbeafe';
    taxCtx.fillRect(0, 0, 180, 180);
    taxCtx.fillStyle = '#1e40af';
    taxCtx.beginPath();
    taxCtx.roundRect(48, 32, 84, 116, 12);
    taxCtx.fill();
    taxCtx.fillStyle = '#ffffff';
    taxCtx.font = 'bold 54px sans-serif';
    taxCtx.textAlign = 'center';
    taxCtx.textBaseline = 'middle';
    taxCtx.fillText('$', 90, 94);

    // 2. SK Planner Icon (Pink + Heart)
    const skCtx = document.getElementById('sk-canvas').getContext('2d');
    skCtx.fillStyle = '#fce7f3';
    skCtx.fillRect(0, 0, 180, 180);
    skCtx.fillStyle = '#db2777';
    skCtx.font = '95px sans-serif';
    skCtx.textAlign = 'center';
    skCtx.textBaseline = 'middle';
    skCtx.fillText('♥', 90, 96);

    // 3. Badminton Social Icon (Indigo + Badminton)
    const badCtx = document.getElementById('badminton-canvas').getContext('2d');
    badCtx.fillStyle = '#e0e7ff';
    badCtx.fillRect(0, 0, 180, 180);
    badCtx.fillStyle = '#4f46e5';
    badCtx.font = '85px sans-serif';
    badCtx.textAlign = 'center';
    badCtx.textBaseline = 'middle';
    badCtx.fillText('🏸', 90, 95);

    function downloadIcon(canvasId) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = 'apple-touch-icon.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
